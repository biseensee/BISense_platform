# Background worker — scales independently of the API on queue depth
# (arq's Redis-backed queue length), not HTTP traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-platform-worker
spec:
  replicas: 3
  selector:
    matchLabels: { app: bi-platform-worker }
  template:
    metadata:
      labels: { app: bi-platform-worker }
    spec:
      containers:
        - name: worker
          image: registry.example.com/bi-platform/worker:latest
          envFrom:
            - configMapRef: { name: bi-platform-api-config }
            - secretRef: { name: bi-platform-api-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
