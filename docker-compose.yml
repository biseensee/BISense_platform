x-backend-env: &backend-env
  APP_ENV: local
  DEBUG: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: bi_platform
  POSTGRES_PASSWORD: bi_platform
  POSTGRES_DB: bi_platform
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: local-dev-secret-do-not-use-in-production
  DATASOURCE_ENCRYPTION_KEY: 5wPz0h8s7iC8b2m6C9v5U6d3B8m1E9y4Q3d3W1n0y0k=
  BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bi_platform
      POSTGRES_PASSWORD: bi_platform
      POSTGRES_DB: bi_platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Connection pooler in front of Postgres — this is what makes the
  # platform survive 1000+ concurrent API workers without exhausting
  # Postgres's own max_connections. In dev it just proxies through.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://bi_platform:bi_platform@postgres:5432/bi_platform
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "50"
    ports: ["6432:6432"]
    depends_on:
      postgres: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/src:/app/src

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  pgdata:
  minio-data:
