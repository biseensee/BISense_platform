[project]
name = "bi-platform"
version = "0.1.0"
description = "Enterprise BI platform backend — FastAPI, Clean Architecture, async"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "arq>=0.26",           # async task queue (scheduled report refresh, cache warmers)
    "clickhouse-connect>=0.7",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "aiosqlite>=0.20",     # in-memory DB for unit tests
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
